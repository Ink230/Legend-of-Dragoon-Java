name: Build feature branches

on:
  push:
    branches:
      - addition-modding-random
      - d-spells-modding-updates
      - wmap-new-system
      - custom-submaps
      - main.spike-testing
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and assemble
        run: ./gradlew --no-daemon compileJava compileTestJava assemble -Pos=linux -Parch=x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: sc-${{ github.sha }}
          path: build/libs
          if-no-files-found: error
